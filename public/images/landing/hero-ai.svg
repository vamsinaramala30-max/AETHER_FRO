<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="#0B0F19"/>
  <rect x="20" y="20" width="760" height="460" rx="12" fill="url(#bg-glow)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- AI Neural Node Grid -->
  <g opacity="0.6">
    <circle cx="250" cy="180" r="4" fill="#06B6D4"/>
    <circle cx="400" cy="120" r="6" fill="#3B82F6"/>
    <circle cx="550" cy="180" r="4" fill="#8B5CF6"/>
    <circle cx="300" cy="320" r="5" fill="#38BDF8"/>
    <circle cx="500" cy="320" r="5" fill="#A855F7"/>

    <line x1="250" y1="180" x2="400" y2="120" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="400" y1="120" x2="550" y2="180" stroke="#3B82F6" stroke-width="1.5"/>
    <line x1="250" y1="180" x2="300" y2="320" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="550" y1="180" x2="500" y2="320" stroke="#8B5CF6" stroke-width="1.5"/>
    <line x1="300" y1="320" x2="500" y2="320" stroke="url(#core-glow)" stroke-width="2"/>
  </g>

  <!-- Central Core HUD -->
  <circle cx="400" cy="250" r="70" stroke="url(#core-glow)" stroke-width="3" fill="#0F172A" fill-opacity="0.8"/>
  <circle cx="400" cy="250" r="45" stroke="#38BDF8" stroke-width="1" stroke-dasharray="6 6"/>
  <circle cx="400" cy="250" r="18" fill="url(#core-glow)"/>
</svg>
