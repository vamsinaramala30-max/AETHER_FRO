<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aether-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="#0B0F19"/>
  <!-- Connecting Workflow Lines -->
  <path d="M 200 250 Q 300 150 400 250 T 600 250" fill="none" stroke="url(#aether-glow)" stroke-width="4" stroke-dasharray="8 8"/>
  <!-- Node 1: Input -->
  <rect x="120" y="200" width="140" height="100" rx="12" fill="url(#card-grad)" stroke="#374151" stroke-width="2"/>
  <circle cx="190" cy="235" r="16" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4" stroke-width="2"/>
  <rect x="150" y="265" width="80" height="8" rx="4" fill="#4B5563"/>
  <!-- Node 2: AI Core Processing -->
  <rect x="330" y="180" width="140" height="140" rx="16" fill="url(#card-grad)" stroke="#8B5CF6" stroke-width="2"/>
  <polygon points="400,215 425,260 375,260" fill="url(#aether-glow)"/>
  <circle cx="400" cy="285" r="12" fill="#8B5CF6"/>
  <!-- Node 3: Output -->
  <rect x="540" y="200" width="140" height="100" rx="12" fill="url(#card-grad)" stroke="#374151" stroke-width="2"/>
  <rect x="570" y="230" width="80" height="10" rx="5" fill="#06B6D4"/>
  <rect x="570" y="250" width="60" height="8" rx="4" fill="#4B5563"/>
  <rect x="570" y="266" width="40" height="8" rx="4" fill="#374151"/>
</svg>
