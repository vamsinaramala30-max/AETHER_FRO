<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" rx="16" fill="#0B0F19"/>
  <!-- Large Gear -->
  <g transform="translate(320, 170)" fill="#1F2937" stroke="#06B6D4" stroke-width="3">
    <circle cx="80" cy="80" r="60"/>
    <rect x="70" y="0" width="20" height="160" rx="4"/>
    <rect x="70" y="0" width="20" height="160" rx="4" transform="rotate(45 80 80)"/>
    <rect x="70" y="0" width="20" height="160" rx="4" transform="rotate(90 80 80)"/>
    <rect x="70" y="0" width="20" height="160" rx="4" transform="rotate(135 80 80)"/>
    <circle cx="80" cy="80" r="30" fill="#0B0F19"/>
  </g>
  <!-- Small Gear -->
  <g transform="translate(450, 270)" fill="#1F2937" stroke="#8B5CF6" stroke-width="3">
    <circle cx="40" cy="40" r="30"/>
    <rect x="34" y="0" width="12" height="80" rx="2"/>
    <rect x="34" y="0" width="12" height="80" rx="2" transform="rotate(90 40 40)"/>
    <circle cx="40" cy="40" r="15" fill="#0B0F19"/>
  </g>
</svg>
