    <!-- Rocket Body -->
    <path d="M 150 20 C 200 80 200 180 150 240 C 100 180 100 80 150 20 Z" fill="#1F2937" stroke="#06B6D4" stroke-width="3"/>
    <circle cx="150" cy="110" r="24" fill="#06B6D4" fill-opacity="0.3" stroke="#06B6D4" stroke-width="3"/>
    <!-- Left Wing -->
